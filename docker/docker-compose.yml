services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5440:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rentalert}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rentalert}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER:-identity_ms}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD in docker/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - monitoring

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - monitoring

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9121:9121"
    environment:
      REDIS_ADDR: "${REDIS_ADDR:-redis://redis:6379}"
      REDIS_USER: "${REDIS_USER:-}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    networks:
      - monitoring

volumes:
  redis_data:
  postgres_data:

networks:
  monitoring:
