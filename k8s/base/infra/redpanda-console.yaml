apiVersion: v1
kind: Service
metadata:
  name: redpanda-console
  labels:
    app.kubernetes.io/name: redpanda-console
    app.kubernetes.io/part-of: rentalert
spec:
  selector:
    app.kubernetes.io/name: redpanda-console
  ports:
    - name: http
      port: 9999
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda-console
  labels:
    app.kubernetes.io/name: redpanda-console
    app.kubernetes.io/part-of: rentalert
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda-console
        app.kubernetes.io/part-of: rentalert
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z kafka 9092; do echo "waiting for kafka"; sleep 2; done
      containers:
        - name: redpanda-console
          image: redpandadata/console:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9999
          env:
            - name: KAFKA_BROKERS
              value: kafka:9092
            - name: SERVER_LISTENPORT
              value: "9999"
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
