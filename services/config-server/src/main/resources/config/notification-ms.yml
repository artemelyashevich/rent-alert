server:
  port: 8082

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5440/notification}
    username: ${DB_USERNAME:${NOTIFICATION_DB_USER:notification_ms}}
    password: ${DB_PASSWORD:${NOTIFICATION_DB_PASSWORD:}}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

eureka:
  client:
    jersey:
      # telegrambots brings jersey-client onto the classpath; without this Eureka picks the Jersey transport,
      # which needs eureka-client-jersey3, finds no TransportClientFactories and fails to register
      enabled: false

app:
  crypto:
    # Must equal identity-ms: receivers in NotificationRequest are encrypted there with this key,
    # deduplication keys are hashed with the HMAC key
    aes-key: ${APP_CRYPTO_AES_KEY:}
    hmac-key: ${APP_CRYPTO_HMAC_KEY:}
  telegram:
    # The bot's incoming commands aren't ported from the monolith yet (no TelegramMessageService), so it's off by default
    bot-enabled: ${TELEGRAM_BOT_ENABLED:false}
    bot-token: ${TELEGRAM_MAIN_BOT_TOKEN:}
    bot-name: ${TELEGRAM_MAIN_BOT_NAME:RentAlert}
    # Bot API URL with %s for the admin bot token, e.g. https://api.telegram.org/bot%s/sendMessage
    url: ${TELEGRAM_URL:https://api.telegram.org/bot%s/sendMessage}
    admin-token: ${TELEGRAM_ADMIN_BOT_TOKEN:}
    admin-chat-id: ${TELEGRAM_ADMIN_BOT_CHAT_ID:}
  http:
    client:
      max-connections: 200
      max-connections-per-route: 50
      connect-timeout-ms: 5000
      connection-request-timeout-ms: 3000
      read-timeout-ms: 15000
      idle-evict-seconds: 30
      validate-after-inactivity-seconds: 5
      connection-ttl-minutes: 5
