server:
  port: 8085

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5440/processing}
    username: ${DB_USERNAME:${PROCESSING_DB_USER:processing_ms}}
    password: ${DB_PASSWORD:${PROCESSING_DB_PASSWORD:}}

app:
  kafka:
    inbox:
      enabled: true
  schedulers:
    enabled: true
  parsers:
    # пауза между запросами по разным городам одного провайдера
    city-request-delay-ms: ${PARSER_CITY_REQUEST_DELAY_MS:1000}
    city-request-jitter-ms: ${PARSER_CITY_REQUEST_JITTER_MS:500}
  kufar:
    url: ${KUFAR_URL:}
  realt:
    url: ${REALT_URL:}
  onliner:
    url: ${ONLINER_URL:}
  currency:
    frankfurter-url: ${CURRENCY_FRANKFURTER_URL:https://api.frankfurter.dev}
