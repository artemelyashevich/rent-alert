server:
  port: 8222
spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: identity-ms
              uri: lb://identity-ms
              predicates:
                - Path=/api/v1/identity/**
            - id: notification-ms
              uri: lb://notification-ms
              predicates:
                - Path=/api/v1/notification/**
              filters:
                - StripPrefix=2
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedHeaders:
                  - "*"
                allowedMethods:
                  - "GET"
                  - "POST"
                  - "PATCH"
                  - "DELETE"
                  - "OPTIONS"
          default-filters:
            - name: Retry
              args:
                retries: 3
                methods: GET,POST,PATCH,DELETE

eureka:
  instance:
    hostname: localhost