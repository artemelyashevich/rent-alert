spring:
  lifecycle:
    timeout-per-shutdown-phase: 10s
  # Jackson
  jackson:
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: ${JACKSON_TIME_ZONE:UTC}
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6400}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  servlet:
    context-path: ${CONTEXT_PATH:/}
    session:
      timeout: 30m
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 2048
  shutdown: graceful
  forward-headers-strategy: framework


management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:health,info,metrics,prometheus,env}
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true

logging:
  level:
    com.rentalert: ${LOG_LEVEL_APP:DEBUG}
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS,Europe/Minsk
    console: "%d{${logging.pattern.dateformat}} %clr(%-5level) [%thread] [%X{traceId:-}] %logger{0} : %replace(%msg){'\\R+',' '} %ex%n"

app:
  auth:
    # JWT secrets (JwtService, common-util): at least 32 bytes each, the same in every service.
    # Startup fails when unset or too short.
    access-secret: ${APP_AUTH_ACCESS_SECRET:}
    refresh-secret: ${APP_AUTH_REFRESH_SECRET:}
  internal:
    # Shared secret of service-to-service calls (X-Internal-Token); internal endpoints reject everything when unset
    token: ${APP_INTERNAL_TOKEN:}
  ip-rate-limit:
    enabled: ${IP_RATE_LIMIT_ENABLED:true}
    max-requests-without-token: ${IP_RATE_LIMIT_MAX_REQUESTS:60}
    window-seconds: ${IP_RATE_LIMIT_WINDOW_SECONDS:60}
    block-duration-seconds: ${IP_RATE_LIMIT_BLOCK_SECONDS:900}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-window: ${RATE_LIMIT_REQUESTS_PER_WINDOW:50}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:10}
