server:
  port: 8081

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5440/identity}
    username: ${DB_USERNAME:${IDENTITY_DB_USER:identity_ms}}
    password: ${DB_PASSWORD:${IDENTITY_DB_PASSWORD:}}

app:
  crypto:
    # Base64 AES key for CryptoService (common-util); must equal the key the stored data was encrypted with.
    aes-key: ${APP_CRYPTO_AES_KEY:}
    # Base64 HMAC key for HmacBlindIndexService (common-util). Must equal the key the stored blind-index
    # hashes were computed with, otherwise they won't match. Startup fails when unset.
    hmac-key: ${APP_CRYPTO_HMAC_KEY:}
  telegram:
    # Verifies Telegram Mini App initData
    bot-token: ${TELEGRAM_MAIN_BOT_TOKEN:}
    auth-date-ttl-seconds: 3600
