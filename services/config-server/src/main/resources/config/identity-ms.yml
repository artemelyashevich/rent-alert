server:
  port: 8081

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5440/identity}
    # DB_* wins; otherwise the same names as docker/.env, so that file can be loaded as-is.
    # Password has no real default: when neither variable is set, startup fails with
    # "The server requested SCRAM-based authentication, but no password was provided".
    # (The empty default matters: Boot binds an unresolved ${...} literally, which would
    # surface as a misleading "password authentication failed" instead.)
    username: ${DB_USERNAME:${IDENTITY_DB_USER:identity_ms}}
    password: ${DB_PASSWORD:${IDENTITY_DB_PASSWORD:}}
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6400}

app:
  auth:
    # JWT signing secrets (JwtService, common-util): at least 32 bytes each. Must equal the monolith's
    # secrets while both issue/accept the same tokens. Startup fails when unset or too short.
    access-secret: ${APP_AUTH_ACCESS_SECRET:}
    refresh-secret: ${APP_AUTH_REFRESH_SECRET:}
  crypto:
    # Base64 AES key for CryptoService (common-util); must equal the monolith's to decrypt its data.
    aes-key: ${APP_CRYPTO_AES_KEY:}
    # Base64 HMAC key for HmacBlindIndexService (common-util). Must equal the monolith's key if its
    # data is reused, otherwise stored blind-index hashes won't match. Startup fails when unset.
    hmac-key: ${APP_CRYPTO_HMAC_KEY:}
