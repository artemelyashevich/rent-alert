server:
  port: 8084

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5440/listing}
    username: ${DB_USERNAME:${LISTING_DB_USER:listing_ms}}
    password: ${DB_PASSWORD:${LISTING_DB_PASSWORD:}}
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6400}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

app:
  auth:
    # Must equal identity-ms: access tokens issued there are verified here (AbstractSecurityConfiguration)
    access-secret: ${APP_AUTH_ACCESS_SECRET:}
    refresh-secret: ${APP_AUTH_REFRESH_SECRET:}
